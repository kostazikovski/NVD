<!DOCTYPE html>
<html lang="mk" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Racing Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="bg-black">

<canvas id="renderCanvas"></canvas>

<section id="carSelect" class="position-absolute top-0 start-0 w-100 h-100 d-flex bg-black" style="z-index:30; overflow-y:auto;">
    <div class="m-auto text-center p-3 p-md-4" style="max-width: 1000px; width:100%;">
        <h1 class="fw-semibold mb-1">Babylon Racing</h1>
        <p class="text-body-secondary mb-4">Избери кола</p>
        <div id="carList" class="row row-cols-1 row-cols-md-3 g-4 justify-content-center w-100"></div>
    </div>
</section>

<button id="backToMenuBtn" class="back-to-menu-btn d-none btn btn-sm text-white bg-body-tertiary bg-opacity-75 position-absolute top-0 start-0 m-3" style="z-index:10;">
    &larr; Избор на кола
</button>

<div id="topbar" class="d-none position-absolute top-0 start-50 translate-middle-x mt-3 bg-body-tertiary bg-opacity-75 text-center small px-3 py-2 rounded-3" style="z-index:10;">
    WASD / стрелки за возење &nbsp;•&nbsp; Space = рачна кочница &nbsp;•&nbsp; R = ресетирај
</div>

<div id="hud" class="d-none position-absolute bottom-0 start-50 translate-middle-x mb-4 d-flex gap-2" style="z-index:10; pointer-events:none;">
    <div class="bg-body-tertiary bg-opacity-75 rounded-3 px-3 py-2 text-center" style="min-width:72px;">
        <div class="text-uppercase text-body-secondary" style="font-size:.65rem; letter-spacing:.03em;">Круг</div>
        <div class="fw-semibold" id="lapVal">1/3</div>
    </div>
    <div class="bg-body-tertiary bg-opacity-75 rounded-3 px-3 py-2 text-center" style="min-width:72px;">
        <div class="text-uppercase text-body-secondary" style="font-size:.65rem; letter-spacing:.03em;">Време</div>
        <div class="fw-semibold" id="timeVal">0.0</div>
    </div>
    <div class="bg-body-tertiary bg-opacity-75 rounded-3 px-3 py-2 text-center" style="min-width:72px;">
        <div class="text-uppercase text-body-secondary" style="font-size:.65rem; letter-spacing:.03em;">Најдобро</div>
        <div class="fw-semibold" id="bestVal">--</div>
    </div>
    <div class="bg-body-tertiary bg-opacity-75 rounded-3 px-3 py-2 text-center" style="min-width:72px;">
        <div class="text-uppercase text-body-secondary" style="font-size:.65rem; letter-spacing:.03em;">Брзина</div>
        <div class="fw-semibold" id="speedVal">0</div>
    </div>
</div>

<div id="countdown" class="overlay-center display-1 fw-bold text-white" style="display:none; z-index:15;"></div>

<div id="finishScreen" class="overlay-center flex-column text-center bg-black bg-opacity-75" style="display:none; z-index:20;">
    <h1 class="fw-semibold mb-2">Крај на трката!</h1>
    <p id="finishSummary" class="text-body-secondary mb-3"></p>
    <div class="d-flex gap-2">
        <button id="restartBtn" class="btn btn-primary px-4">Вози повторно</button>
        <button class="back-to-menu-btn btn btn-outline-light px-4">Избор на кола</button>
    </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
